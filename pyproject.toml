[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetnotes"
version = "0.2.8"
description = "Private, local meeting note-taker for Zoom, Teams and Google Meet. Nothing joins the call."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "psutil>=5.9",
    "soundcard>=0.4.3; platform_system == 'Windows'",
    "qrcode>=7.4",
    "cryptography>=42",
    "keyring>=24",
    "av>=11",
    "mss>=9",
    "icalendar>=6",
    "recurring-ical-events>=3",
]

[project.optional-dependencies]
# Desktop window (Edge WebView2 on Windows) and the notification-area icon.
app = ["pywebview>=5", "pystray>=0.19", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
meetnotes = "meetnotes.cli:main"

[project.gui-scripts]
# A windowless launcher (meetnotes-app.exe on Windows) for the desktop shortcut.
meetnotes-app = "meetnotes.desktop:main"

[tool.setuptools.packages.find]
include = ["meetnotes*"]

[tool.setuptools.package-data]
meetnotes = ["web/*", "_release.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
