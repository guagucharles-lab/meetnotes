name: release
# Push a tag like v0.2.1 and this builds the wheel, both installers, the Android
# APK and update.json, and attaches them to a GitHub release. Installed copies
# then find the new version at .../releases/latest/download/update.json.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Android build tools
        run: sudo apt-get update && sudo apt-get install -y -qq android-sdk-platform-23 aapt apksigner dalvik-exchange zipalign
      - name: Android signing key
        # Keep the keystore as a repository secret (base64 of android/meetnotes.keystore).
        # The same key must sign every APK, or Android refuses the update.
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/meetnotes.keystore
          fi
      - name: Build release
        run: |
          pip install --quiet wheel setuptools pillow
          python release.py --owner "${GITHUB_REPOSITORY%%/*}" --repo "${GITHUB_REPOSITORY##*/}" \
            --notes "${{ github.event.head_commit.message }}"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
