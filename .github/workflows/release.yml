name: release
# When a new version (pyproject.toml) reaches main, this builds the wheel, both
# installers, the Android APK and update.json, and publishes them as release
# v<version>. Installed copies find it at .../releases/latest/download/update.json
# and offer "Päivitä nyt". Pushing a tag like v0.2.5 works too.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v exists already; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.v.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - name: Android build tools
        if: steps.v.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y -qq android-sdk-platform-23 aapt apksigner dalvik-exchange zipalign
      - name: Android signing key
        if: steps.v.outputs.skip != 'true'
        # Keep the keystore as a repository secret (base64 of android/meetnotes.keystore).
        # The same key must sign every APK, or Android refuses the update.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/meetnotes.keystore
          fi
      - name: Build release
        if: steps.v.outputs.skip != 'true'
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          pip install --quiet wheel setuptools pillow
          python release.py --owner "${GITHUB_REPOSITORY%%/*}" --repo "${GITHUB_REPOSITORY##*/}" \
            --notes "$(printf '%s' "$NOTES" | head -n 1)"
      - name: Publish
        if: steps.v.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: dist/*
